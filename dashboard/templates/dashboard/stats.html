<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>통계</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #222;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 24px;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 32px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-item {
            display: block;
            padding: 14px 16px;
            border-radius: 10px;
            color: #d1d5db;
            text-decoration: none;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: #374151;
            color: white;
        }

        .main {
            flex: 1;
            padding: 32px;
        }

        .page-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .card-label {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .chart-wrap {
            max-width: 420px;
            margin-top: 24px;
        }

        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: auto;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="layout">

    <div class="sidebar">
        <div class="sidebar-title">📊 Dashboard</div>

        <div class="sidebar-menu">
            <a href="/" class="sidebar-item">📊 대시보드</a>
            <a href="/projects/" class="sidebar-item">📁 프로젝트</a>
            <a href="/tasks/" class="sidebar-item">✅ 작업</a>
            <a href="/stats/" class="sidebar-item active">📈 통계</a>
            <a href="/settings/" class="sidebar-item">⚙ 설정</a>
        </div>
    </div>

    <div class="main">
        <div class="page-title">통계</div>

        <div class="cards">
            <div class="card">
                <div class="card-label">프로젝트</div>
                <div class="card-value">{{ project_count }}</div>
            </div>

            <div class="card">
                <div class="card-label">전체 작업</div>
                <div class="card-value">{{ total_tasks }}</div>
            </div>

            <div class="card">
                <div class="card-label">예정</div>
                <div class="card-value">{{ todo_tasks_count }}</div>
            </div>

            <div class="card">
                <div class="card-label">진행 중</div>
                <div class="card-value">{{ in_progress_tasks }}</div>
            </div>

            <div class="card">
                <div class="card-label">완료</div>
                <div class="card-value">{{ completed_tasks }}</div>
            </div>
        </div>

        <div class="section">
            <h2>작업 상태 비율</h2>

            <div class="chart-wrap">
                <canvas id="statsChart"></canvas>
            </div>
        </div>
    </div>

</div>

<script>
    const ctx = document.getElementById("statsChart");

    new Chart(ctx, {
        type: "doughnut",
        data: {
            labels: ["예정", "진행 중", "완료"],
            datasets: [{
                data: [
                    {{ todo_tasks_count }},
                    {{ in_progress_tasks }},
                    {{ completed_tasks }}
                ],
                backgroundColor: [
                    "#94a3b8",
                    "#3b82f6",
                    "#22c55e"
                ],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: "bottom"
                }
            }
        }
    });
</script>
</body>
</html>
