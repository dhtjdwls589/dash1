<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #222;
        }

        .auth-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 24px;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #4338ca;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .bottom-text {
            margin-top: 20px;
            color: #64748b;
            font-size: 14px;
            text-align: center;
        }

        .bottom-text a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="auth-wrap">
    <div class="auth-card">

        <div class="title">
            로그인
        </div>

        <div class="subtitle">
            대시보드에 접속하려면 로그인하세요.
        </div>

        {% if form.errors %}
        <div class="error-box">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <label>아이디</label>
            {{ form.username }}

            <label>비밀번호</label>
            {{ form.password }}

            <button type="submit" class="submit-btn">
                로그인
            </button>

        </form>

        <div class="bottom-text">
            계정이 없다면
            <a href="{% url 'register' %}">
                회원가입
            </a>
        </div>

    </div>
</div>

</body>
</html>
