<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>작업 수정</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #222;
        }

        .container {
            max-width: 760px;
            margin: 60px auto;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        h1 {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .memo-input {
            resize: vertical;
            min-height: 100px;
        }

        .btn-group {
            margin-top: 28px;
            display: flex;
            gap: 12px;
        }

        .save-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn {
            padding: 12px 18px;
            border-radius: 10px;
            background: #e5e7eb;
            color: #111827;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>작업 수정</h1>

    <form method="post">

        {% csrf_token %}

        <label>프로젝트</label>
        {{ form.project }}

        <label>작업명</label>
        {{ form.name }}

        <label>상태</label>
        {{ form.status }}

        <label>진행률</label>
        {{ form.progress }}

        <label>메모</label>
        {{ form.memo }}

        <div class="btn-group">
            <button type="submit" class="save-btn">저장</button>

            <a href="{% url 'dashboard_index' %}" class="back-btn">
                돌아가기
            </a>
        </div>

    </form>

</div>

</body>
</html>
